<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts für den futuristischen Look -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animierter Hintergrundeffekt -->
    <div class="bg-grid"></div>

    <!-- Click to Enter Screen (Typisch für guns.lol) -->
    <div id="enter-screen">
        <p class="glitch">[ Klicke um einzutreten ]</p>
    </div>

    <!-- Hauptinhalt -->
    <div id="main-content" class="hidden">
        <div class="profile-card">
            <div class="avatar-container">
                <img id="avatar" src="" alt="Avatar">
            </div>
            <h1 id="username" class="neon-text"></h1>
            <p id="bio" class="typewriter"></p>
            
            <div id="socials" class="social-links">
                <!-- Links werden per JavaScript aus der config.js geladen -->
            </div>
        </div>
    </div>

    <!-- Audio Element für Hintergrundmusik -->
    <audio id="bg-audio" loop></audio>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
